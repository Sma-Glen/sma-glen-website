baseURL = "https://sma-glen.com/" # Replace with your actual domain
languageCode = "en-gb"
title = "Sma' Glen"

theme = "PaperMod"
disableKinds = ["RSS"]

[params]
    defaultTheme = "auto" # or dark, light
    ShowShareButtons = false
    ShowReadingTime = false
    ShowPostNavLinks = false
    ShowBreadCrumbs = false
    ShowCodeCopyButtons = false

    [[menu.main]]
        identifier = "home"
        name = "Home"
        url = "/"
        weight = 10

    [[menu.main]]
        identifier = "about"       # A unique, lowercase word for this item
        name = "About"             # The text that will actually show in the menu
        url = "/about/"            # The path to your page (must match the folder/file name)
        weight = 20

[author]
    name = "Joe Hickey"